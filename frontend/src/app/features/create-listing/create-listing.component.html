<div class="create-page">
  <div class="create-box">
    <h2>Подать объявление</h2>

    <div class="form-group">
      <label>Название *</label>
      <input [(ngModel)]="title" placeholder="Например: iPhone 14 Pro" class="input" />
    </div>

    <div class="form-group" *ngFor="let level of levels; let i = index">
      <label>{{ i === 0 ? 'Категория *' : 'Подкатегория' }}</label>
      <select [(ngModel)]="selectedIds[i]" (ngModelChange)="onCategoryChange(i)" class="input">
        <option [value]="null">Выберите...</option>
        <option *ngFor="let cat of level" [value]="cat.id">{{ cat.name }}</option>
      </select>
    </div>

    <div class="form-group">
      <label>Цена (₸) *</label>
      <input [(ngModel)]="price" type="number" placeholder="0" class="input" />
    </div>

    <div class="form-group">
      <label>Фотография (url) *</label>
      <input [(ngModel)]="photo" type="text" placeholder="https://сикссевен.com/image.jpg" class="input" />
      <p class="help-text">Вставьте URL картинки из интернета</p>
    </div>

    <div class="form-group">
      <label>Описание</label>
      <textarea [(ngModel)]="description" placeholder="Опишите товар..." class="input textarea"></textarea>
    </div>

    <button (click)="onSubmit()" class="btn">Опубликовать</button>
  </div>
</div>
